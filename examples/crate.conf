# Crate configuration files use simple key=value entries.
rootfs=./rootfs
cgroup_root=/sys/fs/cgroup
name=demo
hostname=demo-crate
memory=256M
cpu_quota=50000
cpu_period=100000
pids=64
read_only=false
userns=false
network=none
bridge=crate0
# ip=10.88.0.2/24
# gateway=10.88.0.1
detach=false
# log=/var/log/crate/demo.log
env=TERM=xterm-256color
# bind=/srv/data:/data:ro
